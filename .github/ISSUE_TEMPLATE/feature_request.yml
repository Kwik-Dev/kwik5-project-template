name: Feature request
description: Something the the project template should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: A shape for the answer, not necessarily an implementation.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
